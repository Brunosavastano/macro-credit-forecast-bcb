[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-credit-forecast-bcb"
version = "0.1.0"
description = "Forecast macroeconomico de IPCA, Selic e credito com dados BCB, VAR/VECM e Streamlit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "plotly>=5.18",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

